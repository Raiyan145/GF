<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI GF 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe0f0 0%, #ffd6e8 40%, #ffecd2 100%);
    font-family: 'Nunito', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(16px);
    border-radius: 28px;
    box-shadow: 0 8px 40px rgba(255,100,160,0.18), 0 2px 8px rgba(0,0,0,0.06);
    width: 100%; max-width: 420px;
    overflow: hidden;
    border: 1.5px solid rgba(255,180,210,0.5);
  }
  .header {
    background: linear-gradient(90deg, #ff6eb4, #ff9de2, #ffb347);
    padding: 18px 22px 14px;
    display: flex; align-items: center; gap: 14px;
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 2px 10px rgba(255,110,180,0.3);
    flex-shrink: 0;
    animation: heartbeat 2s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .header-info h1 {
    font-family: 'Pacifico', cursive;
    font-size: 1.3rem; color: white;
    text-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .status {
    font-size: 0.78rem; color: rgba(255,255,255,0.9);
    display: flex; align-items: center; gap: 5px;
  }
  .status-dot {
    width: 8px; height: 8px; background: #a8ff78;
    border-radius: 50%; animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .chat-box {
    height: 380px; overflow-y: auto;
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-box::-webkit-scrollbar { width: 4px; }
  .chat-box::-webkit-scrollbar-thumb { background: #ffb3d9; border-radius: 4px; }
  .msg {
    max-width: 80%; padding: 10px 15px;
    border-radius: 18px; font-size: 0.92rem; line-height: 1.5;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }
  .msg.bot {
    background: linear-gradient(135deg, #ffe4f3, #ffd6ec);
    color: #c2185b; align-self: flex-start;
    border-bottom-left-radius: 5px;
    border: 1px solid rgba(255,180,210,0.4);
  }
  .msg.user {
    background: linear-gradient(135deg, #ff6eb4, #ff9de2);
    color: white; align-self: flex-end;
    border-bottom-right-radius: 5px;
  }
  .typing {
    display: none; align-items: center; gap: 5px;
    padding: 10px 15px;
    background: linear-gradient(135deg, #ffe4f3, #ffd6ec);
    border-radius: 18px; border-bottom-left-radius: 5px;
    align-self: flex-start;
    border: 1px solid rgba(255,180,210,0.4);
  }
  .typing span {
    width: 7px; height: 7px; background: #ff6eb4;
    border-radius: 50%; animation: bounce 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-5px); }
  }
  .input-area {
    padding: 14px 16px; display: flex; gap: 10px;
    border-top: 1px solid rgba(255,180,210,0.3);
    background: rgba(255,255,255,0.6);
  }
  .input-area input {
    flex: 1; padding: 11px 16px; border-radius: 50px;
    border: 1.5px solid #ffb3d9;
    font-family: 'Nunito', sans-serif; font-size: 0.9rem;
    outline: none; background: white; color: #444;
    transition: border 0.2s;
  }
  .input-area input:focus { border-color: #ff6eb4; }
  .input-area input::placeholder { color: #cca0bb; }
  .send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #ff6eb4, #ff9de2);
    border: none; cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(255,110,180,0.35);
    transition: transform 0.15s, box-shadow 0.15s; flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.08); }
  .send-btn:active { transform: scale(0.95); }
  .footer {
    text-align: center; padding: 10px;
    font-size: 0.72rem; color: #d4789e; letter-spacing: 0.3px;
  }
  .footer span {
    font-weight: 700;
    background: linear-gradient(90deg, #ff6eb4, #ffb347);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="avatar">🌸</div>
    <div class="header-info">
      <h1>Mitu 💕</h1>
      <div class="status"><div class="status-dot"></div> Online - tomar jonno waiting 🥺</div>
    </div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">Hii baby~ 🌸 Kemon acho tumi? Tomar kotha sunle amar mon bhalo hoye jay 💕</div>
    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Kichhu bolo amar kache... 💬" />
    <button class="send-btn" onclick="sendMessage()">💌</button>
  </div>
</div>

<div class="footer">made by <span>D Raiyan</span> 💗</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const typingEl = document.getElementById('typing');
  const inputEl = document.getElementById('userInput');
  const history = [];

  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function addMsg(text, who) {
    const div = document.createElement('div');
    div.className = `msg ${who}`;
    div.textContent = text;
    chatBox.insertBefore(div, typingEl);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    addMsg(text, 'user');
    history.push({ role: 'user', content: text });

    typingEl.style.display = 'flex';
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-20) })
      });

      const data = await response.json();
      typingEl.style.display = 'none';
      const reply = data.reply || 'Ektu problem hoilo baby~ 🥺';
      addMsg(reply, 'bot');
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      typingEl.style.display = 'none';
      addMsg('Oops baby~ ektu problem hoilo 🥺 Abar try koro!', 'bot');
    }
  }
</script>
</body>
</html>
